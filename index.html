<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Student Result Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Student Result Management System</h1>
  </header>

  <main>
    <section class="card">
      <h2>Add Student</h2>
      <form id="studentForm">
        <input type="text" id="rollNo" placeholder="Roll No" required />
        <input type="text" id="studentName" placeholder="Full Name" required />
        <input type="text" id="studentClass" placeholder="Class" required />

        <div id="subjectsContainer">
          <div class="subject-row">
            <input type="text" class="subjectName" placeholder="Subject" required />
            <input type="number" class="marksObtained" placeholder="Marks Obtained" required />
            <input type="number" class="maxMarks" placeholder="Max Marks" value="100" />
          </div>
        </div>
        <button type="button" id="addSubjectBtn">+ Add Subject</button>
        <button type="submit">Save Student</button>
      </form>
    </section>

    <section class="card">
      <h2>Search</h2>
      <input type="text" id="searchInput" placeholder="Search by name, roll no, or class" />
      <button id="searchBtn">Search</button>
      <button id="clearSearchBtn">Show All</button>
    </section>

    <section class="card">
      <h2>Students</h2>
      <table id="studentsTable">
        <thead>
          <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Class</th>
            <th>Subjects</th>
            <th>Total</th>
            <th>%</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
