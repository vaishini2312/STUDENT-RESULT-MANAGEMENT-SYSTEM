<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Result Management System</h1>

    <div class="form">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="regno" placeholder="Register Number">
        <input type="number" id="m1" placeholder="Subject 1 Marks">
        <input type="number" id="m2" placeholder="Subject 2 Marks">
        <input type="number" id="m3" placeholder="Subject 3 Marks">

        <button onclick="addStudent()">Add Result</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Register No</th>
                <th>Total</th>
                <th>Average</th>
                <th>Grade</th>
            </tr>
        </thead>

        <tbody id="resultTable">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
